<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="nethound logo">
  <title>nethound</title>
  <rect width="256" height="256" rx="52" fill="#1b1f2a"/>
  <!-- the beagle, envhound's hound: floppy ears (the right one mirrors the left), a white blaze, a smile -->
  <g transform="translate(-12.8 -34) scale(1.1)">
  <path id="ear" d="M90 68 C60 66 40 104 42 152 C43 182 62 198 80 186 C98 172 104 124 108 86 Z" fill="#8c4214"/>
  <use href="#ear" xlink:href="#ear" transform="matrix(-1 0 0 1 256 0)"/>
  <path d="M128 48 C172 48 192 80 192 116 C192 154 170 182 128 182 C86 182 64 154 64 116 C64 80 84 48 128 48 Z" fill="#e08a3a"/>
  <path d="M128 60 C135 60 140 92 145 126 L111 126 C116 92 121 60 128 60 Z" fill="#fbf1e3"/>
  <ellipse cx="128" cy="152" rx="42" ry="32" fill="#fbf1e3"/>
  <path d="M88 92 Q100 82 113 90" stroke="#a8521a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M168 92 Q156 82 143 90" stroke="#a8521a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="102" cy="114" r="12" fill="#2b1d14"/><circle cx="98" cy="109.5" r="4" fill="#ffffff"/>
  <circle cx="154" cy="114" r="12" fill="#2b1d14"/><circle cx="150" cy="109.5" r="4" fill="#ffffff"/>
  <path d="M110 136 Q128 127 146 136 Q146 151 128 156 Q110 151 110 136 Z" fill="#2b1d14"/>
  <ellipse cx="121" cy="137" rx="6" ry="2.8" fill="#6a564a"/>
  <path d="M117 167 C117 188 139 188 139 167 Z" fill="#f07c8a"/>
  <path d="M128 172 V180" stroke="#d65a6c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M128 156 V163 M106 160 Q117 172 128 163 Q139 172 150 160" stroke="#2b1d14" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- the network switch it looks over, paws on the edge: a row of ports, two plugged in, one blinking with traffic -->
  <rect x="24" y="172" width="208" height="68" rx="12" fill="#0f1218" stroke="#3a4152" stroke-width="3"/>
  <ellipse cx="88" cy="173" rx="22" ry="12" fill="#e08a3a"/><path d="M77 171 v6 M88 170 v7 M99 171 v6" stroke="#a8521a" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="168" cy="173" rx="22" ry="12" fill="#e08a3a"/><path d="M157 171 v6 M168 170 v7 M179 171 v6" stroke="#a8521a" stroke-width="2.5" stroke-linecap="round"/>
  <defs>
    <path id="port" d="M0 0 h30 v18 h-8 v6 h-14 v-6 h-8 Z" fill="#05070a" stroke="#3a4152" stroke-width="2.5" stroke-linejoin="round"/>
    <g id="plug">
      <path d="M3 6 h24 v12 h-7 v6 h-10 v-6 h-7 Z" fill="#4fa3e0"/>
      <path d="M8 6 v4 M12 6 v4 M16 6 v4 M20 6 v4 M24 6 v4" stroke="#f3c969" stroke-width="1.6"/>
    </g>
  </defs>
  <use href="#port" xlink:href="#port" x="33" y="204"/>
  <use href="#port" xlink:href="#port" x="73" y="204"/>
  <use href="#port" xlink:href="#port" x="113" y="204"/>
  <use href="#port" xlink:href="#port" x="153" y="204"/>
  <use href="#port" xlink:href="#port" x="193" y="204"/>
  <!-- the cables leave through the bottom of the switch -->
  <clipPath id="tile"><rect width="256" height="256" rx="52"/></clipPath>
  <path d="M128 228 V256 M208 228 V256" stroke="#4fa3e0" stroke-width="10" clip-path="url(#tile)"/>
  <use href="#plug" xlink:href="#plug" x="113" y="204"/>
  <use href="#plug" xlink:href="#plug" x="193" y="204"/>
  <!-- link LEDs: idle ports dark, the plugged ones lit, the one the beagle is watching blinks -->
  <g fill="#3a4152"><circle cx="48" cy="194" r="3.5"/><circle cx="88" cy="194" r="3.5"/><circle cx="168" cy="194" r="3.5"/></g>
  <circle cx="208" cy="194" r="3.5" fill="#7fd18b"/>
  <circle cx="128" cy="194" r="3.5" fill="#7fd18b"><animate attributeName="opacity" values="1;1;0.2;0.2" keyTimes="0;.5;.5;1" dur="0.8s" repeatCount="indefinite"/></circle>
</svg>
