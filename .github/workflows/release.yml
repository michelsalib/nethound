# Push a tag vX.Y.Z (after a PR that bumps package.json) to publish: npm (for npx/bunx/npm -g),
# then a GitHub release for install.sh and install.ps1, with the standalone binaries, then pull
# requests in the Homebrew tap and the Scoop bucket.
#
# Three jobs, so untrusted work never holds a write token: tests, then a read-only build, then a
# publish job that waits for approval in the `release` environment, attests the exact files it
# publishes, and publishes them to npm (trusted publishing, no token) and GitHub.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test --timeout 30000

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # cross-compiled here for every platform; CI checks each one runs on its own
      - run: bun run build:bin
      - run: shellcheck install.sh scripts/update-package-repos.sh
      - name: Release files
        run: |
          mkdir release
          cp dist/nethound.js dist/bin/* install.sh install.ps1 release/
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error
      # the Homebrew formula and the Scoop manifest for this release, from its SHA256SUMS; the publish
      # job opens the pull requests in the tap and the bucket
      - run: bun scripts/packages.ts "${GITHUB_REF_NAME#v}" release/SHA256SUMS packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: packages/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # waits for a maintainer's approval
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance, and the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Check the files against SHA256SUMS
        run: cd release && sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: release/*
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm gets the very file attested above; no scripts run here, so nothing rebuilds it.
      # SHA256SUMS goes too: nethound upgrade checks a binary from GitHub against npm's copy
      - name: npm publish
        run: |
          mkdir -p dist && cp release/nethound.js release/SHA256SUMS dist/
          npm publish --provenance --access public --ignore-scripts
      # the provenance attested above, as a release file too: tools that look at the release itself
      # (OpenSSF Scorecard, slsa-verifier) find it there; gh attestation verify needs nothing more
      - run: |
          cp "$BUNDLE" nethound.intoto.jsonl
          gh release create "$GITHUB_REF_NAME" release/* nethound.intoto.jsonl --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages
      # Last, once npm and the GitHub release are done: a pull request in the Homebrew tap and in the
      # Scoop bucket, each merged by its own install CI. PACKAGES_TOKEN, a release-environment secret,
      # can only write to those two repositories; without it, update them by hand (CONTRIBUTING.md).
      - name: Update the Homebrew tap and the Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PACKAGES_TOKEN is not set: update the Homebrew tap and the Scoop bucket by hand"
            exit 0
          fi
          sh scripts/update-package-repos.sh "${GITHUB_REF_NAME#v}" packages
