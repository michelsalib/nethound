name: ci

on:
  push:
    branches: [main]
  pull_request:

# read-only: CI never writes to the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # each OS has its own collector; arm64 Linux runs its own binary
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node: [24]
        # the oldest Node versions engines allows run the built file too
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # actions are pinned to a commit; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # bun runs the tests and the build; tests also run the built file on node, as users do
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test --coverage --timeout 30000
      - run: bun run build
      - run: node dist/nethound.js --version
      - run: node dist/nethound.js map
      # the release files must be reproducible from the source: the same build twice
      - name: Build is deterministic
        if: runner.os == 'Linux'
        run: cp dist/nethound.js /tmp/first.js && bun run build && cmp /tmp/first.js dist/nethound.js
      # the fixture is generated: it must match its script
      - name: Fixture is up to date
        if: runner.os == 'Linux'
        run: python3 scripts/fixture.py && git diff --exit-code test/fixtures
      # the release cross-compiles them all on Linux; each OS runs its own, and prints every hash:
      # the same on every runner means the cross-compiled ones are the native ones
      - name: Standalone binaries
        if: matrix.node == 24
        shell: bash
        run: |
          bun run build:bin
          (cd dist/bin && (sha256sum * 2>/dev/null || shasum -a 256 *))
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) bin=nethound-linux-x64 ;;
            Linux-ARM64) bin=nethound-linux-arm64 ;;
            macOS-ARM64) bin=nethound-darwin-arm64 ;;
            macOS-X64) bin=nethound-darwin-x64 ;;
            Windows-X64) bin=nethound-windows-x64.exe ;;
          esac
          dist/bin/$bin --version
          dist/bin/$bin map > /dev/null
          dist/bin/$bin list
      - run: shellcheck install.sh scripts/update-package-repos.sh
        if: runner.os == 'Linux'
      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
